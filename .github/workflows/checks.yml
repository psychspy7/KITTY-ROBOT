name: Project health checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python simulator tests
        working-directory: software/simulator
        run: python -m unittest discover -s tests -v
  room-check-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check browser demo JavaScript syntax
        run: node --check software/room-check-demo/app.js
      - name: Run room-check simulation checks
        run: node software/room-check-demo/test-command.cjs

