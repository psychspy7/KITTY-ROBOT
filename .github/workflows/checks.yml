name: Simulator checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run simulator tests
        working-directory: software/simulator
        run: python -m unittest discover -s tests -v
      - name: Run guarded preview tests
        working-directory: software/kitty
        run: python -B -m unittest discover -s tests -v
      - name: Check CAD measurement intake
        working-directory: design/r2/cad
        run: python -B -m unittest discover -s checks -p test_parameters.py -v
